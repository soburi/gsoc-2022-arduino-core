syntax = "proto3";

package arduino;

import "arduino_opts.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

service Print {
  rpc WriteByte(google.protobuf.UInt32Value) returns (google.protobuf.UInt32Value) {
    option (arduino.cpp_name) = "write";
    option (arduino.cpp_return) = "size_t";
    option (arduino.cpp_arg_types) = "uint8_t";
  }
  rpc WriteBuffer(google.protobuf.BytesValue) returns (google.protobuf.UInt32Value) {
    option (arduino.cpp_name) = "write";
    option (arduino.cpp_return) = "size_t";
    option (arduino.cpp_arg_types) = "const uint8_t *";
    option (arduino.cpp_arg_types) = "size_t";
  }
  rpc AvailableForWrite(google.protobuf.Empty) returns (google.protobuf.Int32Value) {
    option (arduino.cpp_name) = "availableForWrite";
    option (arduino.cpp_return) = "int";
  }
  rpc Flush(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (arduino.cpp_name) = "flush";
  }
}
