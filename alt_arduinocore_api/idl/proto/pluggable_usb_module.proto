syntax = "proto3";

package arduino;

import "arduino_opts.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

service PluggableUSBModule {
  option (arduino.extra_includes) = "api/PluggableUSB.h";

  rpc Setup(google.protobuf.Empty) returns (google.protobuf.BoolValue) {
    option (arduino.cpp_decl) = "bool setup(USBSetup& setup)";
  }
  rpc GetInterface(google.protobuf.Empty) returns (google.protobuf.Int32Value) {
    option (arduino.cpp_decl) = "int getInterface(uint8_t* interfaceCount)";
  }
  rpc GetDescriptor(google.protobuf.Empty) returns (google.protobuf.Int32Value) {
    option (arduino.cpp_decl) = "int getDescriptor(USBSetup& setup)";
  }
}
