syntax = "proto3";

package arduino;

import "arduino_opts.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

enum SerialParity {
  SERIAL_PARITY_UNSPECIFIED = 0;
  SERIAL_PARITY_EVEN = 0x1;
  SERIAL_PARITY_ODD = 0x2;
  SERIAL_PARITY_NONE = 0x3;
  SERIAL_PARITY_MARK = 0x4;
  SERIAL_PARITY_SPACE = 0x5;
  SERIAL_PARITY_MASK = 0xF;
}

enum SerialStopBit {
  SERIAL_STOP_BIT_UNSPECIFIED = 0;
  SERIAL_STOP_BIT_1 = 0x10;
  SERIAL_STOP_BIT_1_5 = 0x20;
  SERIAL_STOP_BIT_2 = 0x30;
  SERIAL_STOP_BIT_MASK = 0xF0;
}

enum SerialDataLen {
  SERIAL_DATA_UNSPECIFIED = 0;
  SERIAL_DATA_5 = 0x100;
  SERIAL_DATA_6 = 0x200;
  SERIAL_DATA_7 = 0x300;
  SERIAL_DATA_8 = 0x400;
  SERIAL_DATA_MASK = 0xF00;
}

service HardwareSerial {
  option (arduino.base_services) = "Stream";
  option (arduino.generate_api_class) = true;
  option (arduino.generate_service_class) = true;
  option (arduino.generate_service_impl_class) = true;
  option (arduino.api_class_name) = "arduino::HardwareSerial";

  rpc BeginBaud(google.protobuf.UInt64Value) returns (google.protobuf.Empty) {
    option (arduino.cpp_decl) = "void begin(unsigned long baudrate)";
  }
  rpc BeginBaudConfig(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (arduino.cpp_decl) = "void begin(unsigned long baudrate, uint16_t config)";
  }
  rpc End(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (arduino.cpp_decl) = "void end()";
  }
  rpc IsValid(google.protobuf.Empty) returns (google.protobuf.BoolValue) {
    option (arduino.cpp_decl) = "operator bool()";
  }
}
