syntax = "proto3";

package arduino;

import "arduino_opts.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

enum LookaheadMode {
  SKIP_ALL = 0;
  SKIP_NONE = 1;
  SKIP_WHITESPACE = 2;
}

service Stream {
  option (arduino.base_services) = "Print";

  rpc Available(google.protobuf.Empty) returns (google.protobuf.Int32Value) {
    option (arduino.cpp_decl) = "int available()";
  }
  rpc Read(google.protobuf.Empty) returns (google.protobuf.Int32Value) {
    option (arduino.cpp_decl) = "int read()";
  }
  rpc Peek(google.protobuf.Empty) returns (google.protobuf.Int32Value) {
    option (arduino.cpp_decl) = "int peek()";
  }
}
